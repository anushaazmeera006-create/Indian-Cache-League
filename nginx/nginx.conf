user nginx;
worker_processes auto;

events {
    worker_connections 4096;
    use epoll; # Linux async I/O — one worker handles thousands of conns
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream: three identical Go backends. least_conn distributes requests
    # across them (round_robin is the alternative — change this one word).
    upstream backends {
        least_conn;
        server backend-1:8080 max_fails=2 fail_timeout=5s;
        server backend-2:8080 max_fails=2 fail_timeout=5s;
        server backend-3:8080 max_fails=2 fail_timeout=5s;
    }

    # Frontend SPA container (nginx serving the React build).
    upstream frontend {
        server frontend:80;
    }

    # Passive health checks: max_fails/fail_timeout mark a backend down after
    # repeated failures. Active check: GET /api/health on each backend
    # returns {"status":"ok"} — point any external monitor at it.

    server {
        listen 80;
        server_name _;

        # ---- Layer-7 routing by path ----

        # Simulation & ops endpoints
        location ~ ^/api/(simulation|stats|cache|health) {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Score hot path — benefits most from cache + singleflight
        location ~ ^/api/matches/\d+/score {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 10s;
        }

        # Match metadata, leaderboard — same backend pool
        location /api/ {
            proxy_pass http://backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Everything else -> React SPA
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fallback when all backends are down
        error_page 502 503 504 @backend_down;
        location @backend_down {
            default_type application/json;
            return 503 '{"error":"all backends unavailable","service":"ICL"}';
        }
    }
}
