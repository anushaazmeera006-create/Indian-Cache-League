services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icl
      POSTGRES_PASSWORD: iclpass
      POSTGRES_DB: icl
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icl -d icl"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend-1:
    build: ./backend
    environment:
      DATABASE_URL: postgres://icl:iclpass@postgres:5432/icl?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: backend-1
      CACHE_ENABLED: "true"
      CACHE_TTL: 2s
      SIM_TARGET_URL: http://nginx
    depends_on:
      postgres:
        condition: service_healthy

  backend-2:
    build: ./backend
    environment:
      DATABASE_URL: postgres://icl:iclpass@postgres:5432/icl?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: backend-2
      CACHE_ENABLED: "true"
      CACHE_TTL: 2s
      SIM_TARGET_URL: http://nginx
    depends_on:
      postgres:
        condition: service_healthy

  backend-3:
    build: ./backend
    environment:
      DATABASE_URL: postgres://icl:iclpass@postgres:5432/icl?sslmode=disable
      PORT: "8080"
      INSTANCE_ID: backend-3
      CACHE_ENABLED: "true"
      CACHE_TTL: 2s
      SIM_TARGET_URL: http://nginx
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend

volumes:
  pgdata:
